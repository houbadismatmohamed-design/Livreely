<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LIVRILY · Shop</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
    body{background:#0B1120;color:#F8FAFC;min-height:100vh}
    .glass{background:rgba(30,41,59,0.7);backdrop-filter:blur(12px);border:1px solid rgba(56,189,248,0.15);border-radius:16px}
    header{background:rgba(11,17,32,0.9);backdrop-filter:blur(12px);padding:14px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:1000;border-bottom:1px solid rgba(56,189,248,0.1);flex-wrap:wrap;gap:8px}
    .logo{font-size:24px;font-weight:800;background:linear-gradient(135deg,#38BDF8,#2563EB);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.5px}
    .header-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    .lang-btn{background:transparent;border:1px solid rgba(56,189,248,0.2);color:#94A3B8;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:11px;transition:.3s}
    .lang-btn:hover,.lang-btn.active{background:rgba(56,189,248,0.15);color:#F8FAFC;border-color:#38BDF8}
    .container{max-width:1200px;margin:0 auto;padding:24px}
    .product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}
    .product-card{background:rgba(30,41,59,0.7);backdrop-filter:blur(8px);border:1px solid rgba(56,189,248,0.1);border-radius:16px;padding:16px;text-align:center;transition:.3s}
    .product-card:hover{transform:translateY(-4px);border-color:#38BDF8;box-shadow:0 8px 40px rgba(56,189,248,0.15)}
    .product-card .price{font-size:22px;font-weight:700;color:#38BDF8;margin:6px 0}
    .product-card .qty{color:#94A3B8;font-size:12px}
    input,textarea{width:100%;padding:12px 16px;background:rgba(15,23,42,0.8);border:1px solid rgba(56,189,248,0.15);border-radius:10px;color:#F8FAFC;font-size:14px;outline:none;transition:.3s}
    input:focus,textarea:focus{border-color:#38BDF8;box-shadow:0 0 20px rgba(56,189,248,0.1)}
    .btn{padding:10px 20px;border:none;border-radius:10px;font-weight:600;cursor:pointer;transition:.3s}
    .btn-primary{background:linear-gradient(135deg,#2563EB,#38BDF8);color:#fff}
    .btn-primary:hover{transform:scale(1.03);box-shadow:0 0 30px rgba(56,189,248,0.3)}
    .btn-success{background:linear-gradient(135deg,#16A34A,#22C55E);color:#fff}
    .btn-danger{background:linear-gradient(135deg,#DC2626,#EF4444);color:#fff}
    .btn-outline{background:transparent;border:1px solid rgba(56,189,248,0.3);color:#F8FAFC}
    .card{background:rgba(30,41,59,0.6);backdrop-filter:blur(8px);border:1px solid rgba(56,189,248,0.1);border-radius:16px;padding:20px;margin-bottom:20px}
    .cart-item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(56,189,248,0.1);font-size:14px}
    .hidden{display:none!important}
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(30,41,59,0.95);backdrop-filter:blur(12px);border:1px solid #38BDF8;padding:14px 28px;border-radius:12px;color:#F8FAFC;font-weight:600;z-index:9999;display:none;box-shadow:0 8px 40px rgba(0,0,0,.5)}
    .toast.show{display:block;animation:fadeIn .3s}
    @keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    .tab-btn{padding:10px 24px;border:none;border-radius:10px;font-weight:600;cursor:pointer;background:rgba(30,41,59,0.5);color:#94A3B8;transition:.3s}
    .tab-btn.active{background:linear-gradient(135deg,#2563EB,#38BDF8);color:#fff}
    .tab{display:none}.tab.active{display:block}
    .badge{background:linear-gradient(135deg,#2563EB,#38BDF8);padding:2px 12px;border-radius:20px;font-size:12px;color:#fff}
    [dir="rtl"] .header-actions .lang-btn{margin-left:4px;margin-right:0}
    [dir="rtl"] .cart-item{flex-direction:row-reverse}
  </style>
</head>
<body>
  <header>
    <div class="logo"><i class="fas fa-bolt"></i> LIVRILY</div>
    <div class="header-actions">
      <button class="lang-btn active" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="fr">FR</button>
      <button class="lang-btn" data-lang="ar">ع</button>
      <button class="lang-btn" data-lang="dz">درجة</button>
      <span class="badge" id="cartCount">0</span>
      <button class="btn btn-primary" id="viewCartBtn"><i class="fas fa-shopping-cart"></i> <span data-i18n="cart">Cart</span></button>
      <button class="btn btn-outline" id="trackBtn"><i class="fas fa-truck"></i> <span data-i18n="track">Track</span></button>
    </div>
  </header>
  <div class="container">
    <div style="display:flex;gap:12px;margin-bottom:20px;">
      <button class="tab-btn active" data-tab="shop"><i class="fas fa-store"></i> <span data-i18n="shop">Shop</span></button>
      <button class="tab-btn" data-tab="track"><i class="fas fa-search-location"></i> <span data-i18n="trackOrders">Track Orders</span></button>
    </div>

    <div id="tab-shop" class="tab active">
      <div class="card">
        <h2 style="color:#38BDF8;margin-bottom:16px;" data-i18n="luxuryProducts">📦 Luxury Products</h2>
        <div id="productsGrid" class="product-grid"></div>
      </div>
      <div id="cartSection" class="card hidden">
        <h2 style="color:#38BDF8;margin-bottom:16px;" data-i18n="yourCart">🛒 Your Cart</h2>
        <div id="cartItems"></div>
        <div style="display:flex;justify-content:space-between;padding:14px 0;font-size:18px;font-weight:700;border-top:2px solid rgba(56,189,248,0.2);margin-top:10px;">
          <span data-i18n="total">Total</span><span id="cartTotal" style="color:#38BDF8;">0 DA</span>
        </div>
        <button class="btn btn-success" id="checkoutBtn" style="width:100%;margin-top:10px;"><i class="fas fa-credit-card"></i> <span data-i18n="proceedCheckout">Proceed to Checkout</span></button>
        <button class="btn btn-outline" id="closeCartBtn" style="width:100%;margin-top:6px;"><span data-i18n="closeCart">Close Cart</span></button>
      </div>
      <div id="checkoutForm" class="card hidden">
        <h2 style="color:#38BDF8;margin-bottom:16px;" data-i18n="deliveryDetails">📋 Delivery Details</h2>
        <input id="clientName" placeholder="Full Name" data-i18n-placeholder="fullName" />
        <input id="clientPhone" placeholder="Phone Number" style="margin-top:10px;" data-i18n-placeholder="phoneNumber" />
        <textarea id="clientAddress" placeholder="Delivery Address" rows="3" style="margin-top:10px;" data-i18n-placeholder="deliveryAddress"></textarea>
        <div style="display:flex;gap:10px;margin-top:14px;">
          <button class="btn btn-success" id="placeOrderBtn"><i class="fas fa-check"></i> <span data-i18n="placeOrder">Place Order</span></button>
          <button class="btn btn-danger" id="cancelCheckoutBtn"><span data-i18n="cancel">Cancel</span></button>
        </div>
      </div>
    </div>

    <div id="tab-track" class="tab">
      <div class="card">
        <h2 style="color:#38BDF8;margin-bottom:16px;" data-i18n="trackYourOrders">🔍 Track Your Orders</h2>
        <p style="color:#94A3B8;margin-bottom:12px;" data-i18n="trackDesc">Enter your phone number to see live status.</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <input id="trackPhone" placeholder="Phone number" style="flex:1;min-width:200px;" data-i18n-placeholder="phoneNumber" />
          <button class="btn btn-primary" id="trackOrdersBtn"><i class="fas fa-search"></i> <span data-i18n="track">Track</span></button>
        </div>
        <div id="trackResults" style="margin-top:16px;"></div>
      </div>
    </div>
  </div>
  <div id="toast" class="toast"></div>

  <script type="module">
    import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, addDoc, serverTimestamp, query, where } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
    const config = {
      apiKey: "AIzaSyCYF6XBpCqB2ohHTJSLyc1oBe1rGkByzjE",
      authDomain: "livrily-a6e7e.firebaseapp.com",
      projectId: "livrily-a6e7e",
      storageBucket: "livrily-a6e7e.firebasestorage.app",
      messagingSenderId: "904979289112",
      appId: "1:904979289112:web:9981377a9500b940091f6d"
    };
    let app; try { app = getApps().length ? getApp() : initializeApp(config); } catch (_) { app = initializeApp(config); }
    const db = getFirestore(app);
    let products = [], cart = [];
    let toastTimer;
    function showToast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); if(toastTimer) clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),4000); }

    // --- I18N ---
    const i18n = {
      en: {
        cart: "Cart", track: "Track", shop: "Shop", trackOrders: "Track Orders",
        luxuryProducts: "📦 Luxury Products", yourCart: "🛒 Your Cart", total: "Total", proceedCheckout: "Proceed to Checkout", closeCart: "Close Cart",
        deliveryDetails: "📋 Delivery Details", fullName: "Full Name", phoneNumber: "Phone Number", deliveryAddress: "Delivery Address", placeOrder: "Place Order", cancel: "Cancel",
        trackYourOrders: "🔍 Track Your Orders", trackDesc: "Enter your phone number to see live status."
      },
      fr: {
        cart: "Panier", track: "Suivre", shop: "Boutique", trackOrders: "Suivre les commandes",
        luxuryProducts: "📦 Produits de luxe", yourCart: "🛒 Votre panier", total: "Total", proceedCheckout: "Passer à la caisse", closeCart: "Fermer le panier",
        deliveryDetails: "📋 Détails de livraison", fullName: "Nom complet", phoneNumber: "Numéro de téléphone", deliveryAddress: "Adresse de livraison", placeOrder: "Passer la commande", cancel: "Annuler",
        trackYourOrders: "🔍 Suivre vos commandes", trackDesc: "Entrez votre numéro de téléphone pour voir le statut en direct."
      },
      ar: {
        cart: "السلة", track: "تتبع", shop: "المتجر", trackOrders: "تتبع الطلبات",
        luxuryProducts: "📦 منتجات فاخرة", yourCart: "🛒 سلة مشترياتك", total: "الإجمالي", proceedCheckout: "المتابعة إلى الدفع", closeCart: "إغلاق السلة",
        deliveryDetails: "📋 تفاصيل التوصيل", fullName: "الاسم الكامل", phoneNumber: "رقم الهاتف", deliveryAddress: "عنوان التوصيل", placeOrder: "تقديم الطلب", cancel: "إلغاء",
        trackYourOrders: "🔍 تتبع طلباتك", trackDesc: "أدخل رقم هاتفك لمعرفة الحالة الحية."
      },
      dz: {
        cart: "السلة", track: "تتبع", shop: "الحانوت", trackOrders: "تتبع الطلبات",
        luxuryProducts: "📦 منتجات فاخرة", yourCart: "🛒 سلة مشترياتك", total: "المجموع", proceedCheckout: "مشي للدفع", closeCart: "سكر السلة",
        deliveryDetails: "📋 تفاصيل التوصيل", fullName: "السمية الكاملة", phoneNumber: "رقم التليفون", deliveryAddress: "عنوان التوصيل", placeOrder: "سجل الطلب", cancel: "الغي",
        trackYourOrders: "🔍 تتبع طلباتك", trackDesc: "دخل رقم تليفونك باش تشوف الحالة."
      }
    };
    let currentLang = localStorage.getItem('livrily-lang') || 'en';
    function applyLang(lang){
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n;
        if(i18n[lang] && i18n[lang][key] !== undefined) el.textContent = i18n[lang][key];
        else if(i18n['en'][key] !== undefined) el.textContent = i18n['en'][key];
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.dataset.i18nPlaceholder;
        if(i18n[lang] && i18n[lang][key] !== undefined) el.placeholder = i18n[lang][key];
        else if(i18n['en'][key] !== undefined) el.placeholder = i18n['en'][key];
      });
      document.documentElement.dir = (lang === 'ar' || lang === 'dz') ? 'rtl' : 'ltr';
      localStorage.setItem('livrily-lang', lang);
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
    }
    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', () => applyLang(btn.dataset.lang));
    });
    applyLang(currentLang);

    // --- Products ---
    onSnapshot(collection(db, "products"), (snap)=>{
      products=snap.docs.map(d=>({id:d.id,...d.data()}));
      renderProducts();
    });

    function renderProducts(){
      const grid=document.getElementById('productsGrid');
      if(products.length===0){ grid.innerHTML='<p style="color:#94A3B8;" data-i18n="noProducts">No products yet. Shop owners will add products.</p>'; return; }
      grid.innerHTML=products.map(p=>`
        <div class="product-card">
          <div style="font-size:18px;font-weight:600;">${p.name}</div>
          <div class="price">${p.price||0} DA</div>
          <div class="qty"><span data-i18n="inStock">In stock</span>: ${p.qty||0}</div>
          <button class="btn btn-primary" style="margin-top:10px;width:100%;" onclick="addToCart('${p.id}','${p.name.replace(/'/g, "\\'")}',${p.price},${p.qty||0})"><i class="fas fa-plus"></i> <span data-i18n="add">Add</span></button>
        </div>`).join('');
    }

    window.addToCart=function(id,name,price,stock){
      if(stock<=0){ showToast('❌ Out of stock'); return; }
      const existing=cart.find(item=>item.productId===id);
      if(existing){ if(existing.qty>=stock){ showToast('❌ Not enough stock'); return; } existing.qty++; }
      else cart.push({productId:id,name,price,qty:1});
      updateCartUI(); showToast(`✅ ${name} added`);
    };

    function updateCartUI(){
      const total=cart.reduce((s,i)=>s+i.price*i.qty,0);
      const count=cart.reduce((s,i)=>s+i.qty,0);
      document.getElementById('cartCount').textContent=count;
      document.getElementById('cartTotal').textContent=total+' DA';
      document.getElementById('cartItems').innerHTML=cart.map((item,idx)=>`
        <div class="cart-item"><span>${item.name} x${item.qty}</span><span>${item.price*item.qty} DA <button class="btn btn-danger" style="padding:4px 10px;font-size:10px;" onclick="removeFromCart(${idx})"><i class="fas fa-times"></i></button></span></div>`).join('');
    }

    window.removeFromCart=function(idx){ cart.splice(idx,1); updateCartUI(); };

    document.getElementById('viewCartBtn').addEventListener('click',()=>{ document.getElementById('cartSection').classList.toggle('hidden'); document.getElementById('checkoutForm').classList.add('hidden'); });
    document.getElementById('closeCartBtn').addEventListener('click',()=>{ document.getElementById('cartSection').classList.add('hidden'); });
    document.getElementById('checkoutBtn').addEventListener('click',()=>{ if(cart.length===0){ showToast('🛒 Cart is empty'); return; } document.getElementById('checkoutForm').classList.remove('hidden'); document.getElementById('cartSection').classList.add('hidden'); });
    document.getElementById('cancelCheckoutBtn').addEventListener('click',()=>{ document.getElementById('checkoutForm').classList.add('hidden'); document.getElementById('cartSection').classList.remove('hidden'); });

    document.getElementById('placeOrderBtn').addEventListener('click', async ()=>{
      const name=document.getElementById('clientName').value.trim();
      const phone=document.getElementById('clientPhone').value.trim();
      const address=document.getElementById('clientAddress').value.trim();
      if(!name||!phone||!address){ showToast('❌ Fill all fields'); return; }
      if(cart.length===0){ showToast('❌ Cart empty'); return; }
      const firstProduct=products.find(p=>p.id===cart[0].productId);
      if(!firstProduct){ showToast('❌ Product not found'); return; }
      const shopId=firstProduct.shopId; if(!shopId){ showToast('❌ Missing shop info'); return; }
      const total=cart.reduce((s,i)=>s+i.price*i.qty,0);
      try{
        await addDoc(collection(db, "shopOrders"), {
          shopId, clientName:name, phone, address,
          items:cart.map(i=>({productId:i.productId,name:i.name,qty:i.qty,price:i.price})),
          total, status:'pending', createdAt:serverTimestamp()
        });
        showToast('✅ Order placed! Shop owner will confirm.');
        cart=[]; updateCartUI();
        document.getElementById('clientName').value=''; document.getElementById('clientPhone').value=''; document.getElementById('clientAddress').value='';
        document.getElementById('checkoutForm').classList.add('hidden'); document.getElementById('cartSection').classList.add('hidden');
      }catch(e){ showToast('❌ '+e.message); }
    });

    let ordersUnsub=null;
    document.getElementById('trackOrdersBtn').addEventListener('click', ()=>{
      const phone=document.getElementById('trackPhone').value.trim();
      if(!phone){ showToast('❌ Enter phone number'); return; }
      if(ordersUnsub){ ordersUnsub(); ordersUnsub=null; }
      const q=query(collection(db, "orders"), where("phone","==",phone));
      ordersUnsub=onSnapshot(q,(snap)=>{
        const orders=snap.docs.map(d=>({id:d.id,...d.data()}));
        const results=document.getElementById('trackResults');
        if(orders.length===0){ results.innerHTML=`<p style="color:#94A3B8;" data-i18n="noOrdersFound">No delivery found for ${phone} (only after shop accepts)</p>`; return; }
        const statusMap={ pending:{label:'🛒 In Shop',color:'#F59E0B'}, accepted:{label:'✅ Accepted',color:'#2563EB'}, picked:{label:'🚚 With Driver',color:'#3B82F6'}, near:{label:'📍 Near You',color:'#8B5CF6'}, delivered:{label:'✅ Delivered',color:'#22C55E'} };
        results.innerHTML=orders.map(o=>{
          const st=statusMap[o.status]||statusMap.pending;
          return `<div style="background:rgba(15,23,42,0.8);border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid rgba(56,189,248,0.1);">
            <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;"><span><strong>#${o.id.slice(0,6)}</strong> ${o.customer}</span><span style="color:${st.color};font-weight:700;">${st.label}</span><span>${o.driverName||'Unassigned'}</span></div>
            <div style="font-size:12px;color:#94A3B8;margin-top:4px;">${o.address||''}</div></div>`;
        }).join('');
      });
    });

    document.querySelectorAll('.tab-btn').forEach(btn=>{
      btn.addEventListener('click',()=>{
        document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
        document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
      });
    });
    document.getElementById('trackBtn').addEventListener('click',()=>{ document.querySelector('.tab-btn[data-tab="track"]').click(); });

    // Apply i18n to dynamic content after language change
    function reapplyDynamicI18n(){
      // reapply to any elements that might have been updated dynamically
    }
    // Listen for language changes
    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        // Re-render products and cart to update language in dynamic content
        renderProducts();
        updateCartUI();
        // If track results are shown, they have data-i18n attributes but they are static, so fine.
      });
    });
  </script>
</body>
</html>
