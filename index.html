<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LIVRILY · Portal</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,'Segoe UI',Roboto,sans-serif}
        body{background:#0F172A;color:#F8FAFC;min-height:100vh;display:flex;justify-content:center;align-items:center;flex-direction:column;padding:20px}
        .portal-box{background:#1E293B;padding:40px;border-radius:24px;max-width:500px;width:100%;border:1px solid #334155;text-align:center}
        .logo{font-size:40px;margin-bottom:10px}
        h1{color:#38BDF8;font-size:28px;margin-bottom:6px}
        .sub{color:#94A3B8;font-size:14px;margin-bottom:24px}
        .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
        .app-btn{background:#0F172A;padding:16px;border-radius:12px;border:1px solid #334155;text-decoration:none;color:#F8FAFC;transition:.2s;display:flex;flex-direction:column;align-items:center;gap:4px}
        .app-btn:hover{background:#2563EB;border-color:#2563EB;transform:scale(1.02)}
        .app-btn .icon{font-size:24px}
        .app-btn .label{font-weight:600;font-size:13px}
        .app-btn .desc{font-size:10px;color:#94A3B8}
        .footer{margin-top:20px;color:#64748B;font-size:11px}
        @media(max-width:500px){.grid{grid-template-columns:1fr}}
    </style>
</head>
<body>
    <div class="portal-box">
        <div class="logo">🚚</div>
        <h1>LIVRILY</h1>
        <p class="sub">Delivery Management · Shop · COD</p>
        <div class="grid">
            <a href="Client.html" class="app-btn">
                <span class="icon">🛒</span>
                <span class="label">Client Store</span>
                <span class="desc">Browse & order products</span>
            </a>
            <a href="ShopOwner.html" class="app-btn">
                <span class="icon">🏪</span>
                <span class="label">Shop Owner</span>
                <span class="desc">Manage products & orders</span>
            </a>
            <a href="Manager.html" class="app-btn">
                <span class="icon">📊</span>
                <span class="label">Manager</span>
                <span class="desc">Assign drivers & control</span>
            </a>
            <a href="Driver.html" class="app-btn">
                <span class="icon">🚗</span>
                <span class="label">Driver</span>
                <span class="desc">Deliver & update status</span>
            </a>
        </div>
        <div class="footer">All data synced in real-time · Free plan</div>
    </div>
</body>
</html>
