<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LIVRILY · Shop Owner</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,'Segoe UI',Roboto,sans-serif}
        body{background:#0F172A;color:#F8FAFC;min-height:100vh}
        header{background:#1E293B;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:1000;border-bottom:1px solid #334155}
        .logo{color:#38BDF8;font-weight:700;font-size:20px}
        .logo small{font-size:11px;background:#38BDF8;color:#0F172A;padding:2px 10px;border-radius:20px;margin-left:8px}
        .user-info{display:flex;align-items:center;gap:12px}
        .user-info span{color:#94A3B8;font-size:12px}
        .btn{padding:8px 16px;border:none;border-radius:8px;font-weight:600;font-size:12px;cursor:pointer;transition:.1s}
        .btn:active{transform:scale(.96)}
        .btn-primary{background:#2563EB;color:#fff}.btn-primary:hover{background:#1D4ED8}
        .btn-success{background:#16A34A;color:#fff}.btn-success:hover{background:#15803D}
        .btn-danger{background:#DC2626;color:#fff}.btn-danger:hover{background:#B91C1C}
        .btn-warning{background:#F59E0B;color:#0F172A}.btn-warning:hover{background:#D97706}
        .btn-outline{background:transparent;border:1px solid #475569;color:#CBD5E1}.btn-outline:hover{background:#334155}
        .container{max-width:1200px;margin:0 auto;padding:14px}
        .card{background:#1E293B;padding:16px;border-radius:16px;margin-bottom:14px;border:1px solid #334155}
        .card h2{color:#38BDF8;font-size:15px;margin-bottom:10px}
        .card h3{font-size:13px;color:#CBD5E1;margin-bottom:8px}
        .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #2D3748;font-size:12px}
        .row:last-child{border-bottom:none}
        input,select,textarea{width:100%;padding:10px 12px;border:1px solid #334155;border-radius:10px;background:#0F172A;color:#F8FAFC;font-size:13px;margin-top:6px;outline:none}
        input:focus{ border-color:#3B82F6 }
        label{display:block;margin-top:10px;font-size:12px;color:#CBD5E1}
        table{width:100%;border-collapse:collapse;font-size:11px}
        th{background:#2563EB;padding:8px 6px;color:#fff;text-align:center}
        td{padding:8px 6px;border-bottom:1px solid #334155;text-align:center}
        .tab{display:none}.tab.active{display:block}
        nav{display:flex;gap:6px;flex-wrap:wrap;background:#1E293B;padding:10px 16px;position:sticky;top:60px;z-index:999;border-bottom:1px solid #334155}
        nav button{color:#CBD5E1;background:transparent;border:none;padding:8px 14px;border-radius:10px;font-size:12px;font-weight:500;cursor:pointer}
        nav button:hover{background:#334155;color:#fff}
        nav button.active{background:#2563EB;color:#fff}
        .badge{background:#2563EB;padding:2px 10px;border-radius:20px;font-size:11px;color:#fff}
        .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1E293B;border:1px solid #38BDF8;padding:12px 24px;border-radius:12px;color:#F8FAFC;font-weight:600;z-index:9999;display:none}
        .toast.show{display:block}
        .hidden{display:none}
        @media(max-width:600px){nav button{font-size:10px;padding:6px 10px}}
    </style>
</head>
<body>
    <header>
        <div class="logo">🏪 LIVRILY <small>Shop Owner</small></div>
        <div class="user-info">
            <span id="userEmail">Not logged in</span>
            <button class="btn btn-danger" id="logoutBtn">Logout</button>
        </div>
    </header>
    <nav>
        <button class="active" data-tab="dashboard">📊 Dashboard</button>
        <button data-tab="products">📦 Products</button>
        <button data-tab="orders">📋 Orders</button>
    </nav>
    <div class="container">
        <!-- Dashboard -->
        <div id="tab-dashboard" class="tab active">
            <div class="card">
                <h2>📈 Your Shop Stats</h2>
                <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;">
                    <div class="card" style="background:#0F172A;border:1px solid #334155;text-align:center;"><b id="stat-products">0</b><br><small>Products</small></div>
                    <div class="card" style="background:#0F172A;border:1px solid #334155;text-align:center;"><b id="stat-orders">0</b><br><small>Orders</small></div>
                    <div class="card" style="background:#0F172A;border:1px solid #334155;text-align:center;"><b id="stat-pending" style="color:#F59E0B;">0</b><br><small>Pending</small></div>
                </div>
            </div>
            <div class="card"><h2>📋 Recent Orders</h2><div id="recentOrders"></div></div>
        </div>

        <!-- Products -->
        <div id="tab-products" class="tab">
            <div class="card">
                <h2>➕ Add Product</h2>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                    <div><label>Name</label><input id="prod-name" placeholder="Product name" /></div>
                    <div><label>Price (DA)</label><input id="prod-price" type="number" placeholder="0" /></div>
                    <div><label>Quantity</label><input id="prod-qty" type="number" placeholder="0" /></div>
                    <div><label>Image URL (optional)</label><input id="prod-image" placeholder="https://..." /></div>
                </div>
                <button class="btn btn-success" style="width:100%;margin-top:10px;" id="addProductBtn">➕ Add Product</button>
            </div>
            <div class="card">
                <h2>📦 Your Products</h2>
                <div style="overflow-x:auto;"><table><thead><tr><th>Name</th><th>Price</th><th>Qty</th><th>Actions</th></tr></thead><tbody id="productsBody"></tbody></table></div>
            </div>
        </div>

        <!-- Orders -->
        <div id="tab-orders" class="tab">
            <div class="card">
                <h2>📋 Incoming Orders</h2>
                <p id="debugInfo" style="color:#94A3B8;font-size:12px;"></p>
                <div style="overflow-x:auto;"><table><thead><tr><th>#</th><th>Client</th><th>Items</th><th>Total</th><th>Status</th><th>Actions</th></tr></thead><tbody id="ordersBody"></tbody></table></div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, updateDoc, deleteDoc, addDoc, collection, onSnapshot, query, where, serverTimestamp, getDoc } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

        const config = {
            apiKey: "AIzaSyCYF6XBpCqB2ohHTJSLyc1oBe1rGkByzjE",
            authDomain: "livrily-a6e7e.firebaseapp.com",
            projectId: "livrily-a6e7e",
            storageBucket: "livrily-a6e7e.firebasestorage.app",
            messagingSenderId: "904979289112",
            appId: "1:904979289112:web:9981377a9500b940091f6d"
        };

        let app;
        try { app = getApps().length ? getApp() : initializeApp(config); } catch (_) { app = initializeApp(config); }
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null, shopId = null;
        let products = [], shopOrders = [];

        const userEmailSpan = document.getElementById('userEmail');
        const productsBody = document.getElementById('productsBody');
        const ordersBody = document.getElementById('ordersBody');
        const toast = document.getElementById('toast');
        const debugInfo = document.getElementById('debugInfo');

        let toastTimer;
        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // ─── LOGIN OVERLAY ───
        const loginOverlay = document.createElement('div');
        loginOverlay.id = 'loginOverlay';
        loginOverlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);display:flex;justify-content:center;align-items:center;z-index:9999;';
        loginOverlay.innerHTML = `
            <div style="background:#1E293B;padding:30px;border-radius:16px;max-width:400px;width:90%;border:1px solid #334155;">
                <h2 style="color:#38BDF8;margin-bottom:10px;">👋 Shop Owner Login</h2>
                <p style="color:#94A3B8;font-size:13px;margin-bottom:16px;">Enter your email & password (or create a new shop account)</p>
                <input id="loginEmail" placeholder="Email" style="width:100%;padding:12px;border-radius:8px;border:1px solid #334155;background:#0F172A;color:#F8FAFC;margin-bottom:10px;" />
                <input id="loginPassword" type="password" placeholder="Password" style="width:100%;padding:12px;border-radius:8px;border:1px solid #334155;background:#0F172A;color:#F8FAFC;margin-bottom:10px;" />
                <button id="loginBtn" class="btn btn-primary" style="width:100%;">Login</button>
                <button id="signupBtn" class="btn btn-outline" style="width:100%;margin-top:6px;">Create New Shop</button>
                <p id="loginError" style="color:#F87171;font-size:12px;margin-top:8px;text-align:center;"></p>
            </div>
        `;
        document.body.prepend(loginOverlay);

        const loginEmail = document.getElementById('loginEmail');
        const loginPassword = document.getElementById('loginPassword');
        const loginBtn = document.getElementById('loginBtn');
        const signupBtn = document.getElementById('signupBtn');
        const loginError = document.getElementById('loginError');

        async function loginShop(email, pass) {
            try {
                const cred = await signInWithEmailAndPassword(auth, email, pass);
                loginOverlay.style.display = 'none';
                showToast('✅ Logged in as ' + email);
                return cred.user;
            } catch (e) {
                loginError.textContent = e.message;
                return null;
            }
        }

        loginBtn.addEventListener('click', async () => {
            const email = loginEmail.value.trim();
            const pass = loginPassword.value;
            if (!email || !pass) { loginError.textContent = 'Enter email and password'; return; }
            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging...';
            const user = await loginShop(email, pass);
            loginBtn.disabled = false;
            loginBtn.textContent = 'Login';
            if (user) {
                await ensureShopProfile(user);
            }
        });

        signupBtn.addEventListener('click', async () => {
            const email = loginEmail.value.trim();
            const pass = loginPassword.value;
            if (!email || !pass || pass.length < 6) { loginError.textContent = 'Email and password (min 6 chars) required'; return; }
            signupBtn.disabled = true;
            signupBtn.textContent = 'Creating...';
            try {
                const cred = await createUserWithEmailAndPassword(auth, email, pass);
                await ensureShopProfile(cred.user);
                loginOverlay.style.display = 'none';
                showToast('✅ Shop created! Logged in.');
            } catch (e) {
                loginError.textContent = e.message;
            }
            signupBtn.disabled = false;
            signupBtn.textContent = 'Create New Shop';
        });

        async function ensureShopProfile(user) {
            shopId = user.uid;
            const docRef = doc(db, "shops", shopId);
            await setDoc(docRef, { email: user.email, name: user.displayName || 'My Shop', createdAt: serverTimestamp() }, { merge: true });
            console.log('Shop profile ensured for UID:', shopId);
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                loginOverlay.style.display = 'none';
                currentUser = user;
                userEmailSpan.textContent = user.email;
                shopId = user.uid;
                await ensureShopProfile(user);
                initListeners();
                debugInfo.textContent = '🔍 Your shop ID: ' + shopId;
            } else {
                loginOverlay.style.display = 'flex';
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await signOut(auth);
            loginOverlay.style.display = 'flex';
            showToast('Logged out');
        });

        // ─── LISTENERS ───
        function initListeners() {
            const qProducts = query(collection(db, "products"), where("shopId", "==", shopId));
            onSnapshot(qProducts, (snap) => {
                products = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderProducts();
                updateStats();
            });

            const qOrders = query(collection(db, "shopOrders"), where("shopId", "==", shopId));
            onSnapshot(qOrders, (snap) => {
                shopOrders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderOrders();
                updateStats();
                renderRecentOrders();
                if (shopOrders.length === 0) {
                    debugInfo.innerHTML += '<br>No orders found for this shop. Check that orders have the correct shopId.';
                } else {
                    debugInfo.innerHTML += '<br>✅ ' + shopOrders.length + ' orders found.';
                }
            });
        }

        function updateStats() {
            document.getElementById('stat-products').textContent = products.length;
            document.getElementById('stat-orders').textContent = shopOrders.length;
            const pending = shopOrders.filter(o => o.status === 'pending').length;
            document.getElementById('stat-pending').textContent = pending;
        }

        function renderProducts() {
            productsBody.innerHTML = products.map(p => `
                <tr>
                    <td>${p.name}</td>
                    <td>${p.price || 0} DA</td>
                    <td>${p.qty || 0}</td>
                    <td>
                        <button class="btn btn-warning" style="padding:4px 8px;font-size:10px;" onclick="editProduct('${p.id}')">✏️</button>
                        <button class="btn btn-danger" style="padding:4px 8px;font-size:10px;" onclick="deleteProduct('${p.id}')">🗑</button>
                    </td>
                </tr>
            `).join('');
        }

        window.deleteProduct = async function(id) {
            if (!confirm('Delete this product?')) return;
            try {
                await deleteDoc(doc(db, "products", id));
                showToast('✅ Deleted');
            } catch (e) { showToast('❌ ' + e.message); }
        };

        window.editProduct = function(id) {
            const p = products.find(x => x.id === id);
            if (!p) return;
            document.getElementById('prod-name').value = p.name;
            document.getElementById('prod-price').value = p.price;
            document.getElementById('prod-qty').value = p.qty;
            document.getElementById('prod-image').value = p.image || '';
            const btn = document.getElementById('addProductBtn');
            btn.textContent = '✏️ Update Product';
            btn.dataset.editId = id;
        };

        document.getElementById('addProductBtn').addEventListener('click', async () => {
            const name = document.getElementById('prod-name').value.trim();
            const price = parseFloat(document.getElementById('prod-price').value) || 0;
            const qty = parseInt(document.getElementById('prod-qty').value) || 0;
            const image = document.getElementById('prod-image').value.trim();
            if (!name || price < 0 || qty < 0) { showToast('❌ Fill valid values'); return; }
            const btn = document.getElementById('addProductBtn');
            const editId = btn.dataset.editId;
            try {
                if (editId) {
                    await updateDoc(doc(db, "products", editId), { name, price, qty, image });
                    showToast('✅ Product updated');
                    delete btn.dataset.editId;
                    btn.textContent = '➕ Add Product';
                } else {
                    await addDoc(collection(db, "products"), { name, price, qty, image, shopId, createdAt: serverTimestamp() });
                    showToast('✅ Product added');
                }
                document.getElementById('prod-name').value = '';
                document.getElementById('prod-price').value = '';
                document.getElementById('prod-qty').value = '';
                document.getElementById('prod-image').value = '';
            } catch (e) { showToast('❌ ' + e.message); }
        });

        function renderOrders() {
            ordersBody.innerHTML = shopOrders.map(o => `
                <tr>
                    <td>${o.id.slice(0,6)}</td>
                    <td>${o.clientName}<br><small>${o.phone}</small></td>
                    <td>${o.items.map(i => `${i.name} x${i.qty}`).join(', ')}</td>
                    <td>${o.total} DA</td>
                    <td><span style="background:${o.status==='pending'?'#F59E0B':o.status==='accepted'?'#2563EB':o.status==='rejected'?'#DC2626':'#16A34A'};padding:4px 10px;border-radius:20px;font-size:10px;color:#fff;">${o.status}</span></td>
                    <td>
                        ${o.status === 'pending' ? `
                            <button class="btn btn-success" style="padding:4px 8px;font-size:10px;" onclick="acceptOrder('${o.id}')">✅ Accept</button>
                            <button class="btn btn-danger" style="padding:4px 8px;font-size:10px;" onclick="rejectOrder('${o.id}')">❌ Reject</button>
                        ` : '—'}
                    </td>
                </tr>
            `).join('') || '<tr><td colspan="6">No orders yet</td></tr>';
        }

        window.acceptOrder = async function(orderId) {
            try {
                const order = shopOrders.find(o => o.id === orderId);
                if (!order) return;
                await updateDoc(doc(db, "shopOrders", orderId), { status: 'accepted' });
                for (const item of order.items) {
                    const productRef = doc(db, "products", item.productId);
                    const snap = await getDoc(productRef);
                    if (snap.exists()) {
                        const newQty = (snap.data().qty || 0) - item.qty;
                        await updateDoc(productRef, { qty: Math.max(newQty, 0) });
                    }
                }
                const orderData = {
                    customer: order.clientName,
                    phone: order.phone,
                    address: order.address,
                    products: order.items.map(i => ({ name: i.name, qty: i.qty })),
                    qty: order.items.reduce((s,i) => s + i.qty, 0),
                    clientTotal: order.total,
                    yourIncome: order.total,
                    driverKeeps: 0,
                    driver: null,
                    driverId: null,
                    driverEmail: null,
                    driverName: null,
                    status: 'pending',
                    date: new Date().toISOString().slice(0,10),
                    time: new Date().toLocaleTimeString(),
                    createdAt: serverTimestamp(),
                    shopOrderId: orderId
                };
                await addDoc(collection(db, "orders"), orderData);
                showToast('✅ Order accepted. Manager can assign driver.');
            } catch (e) { showToast('❌ ' + e.message); console.error(e); }
        };

        window.rejectOrder = async function(orderId) {
            if (!confirm('Reject this order?')) return;
            try {
                await updateDoc(doc(db, "shopOrders", orderId), { status: 'rejected' });
                showToast('❌ Order rejected');
            } catch (e) { showToast('❌ ' + e.message); }
        };

        function renderRecentOrders() {
            const recent = shopOrders.slice(0, 5);
            document.getElementById('recentOrders').innerHTML = recent.map(o => `
                <div class="row"><span>${o.clientName}</span><span>${o.total} DA <span style="color:#94A3B8;">${o.status}</span></span></div>
            `).join('') || '<p style="color:#94A3B8;">No orders yet</p>';
        }

        document.querySelectorAll('nav button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
            });
        });
    </script>
</body>
</html>
