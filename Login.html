<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - LIVRILY</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{display:flex;justify-content:center;align-items:center;min-height:100vh;background:linear-gradient(135deg,#0f172a,#1e293b)}
.loginBox{background:white;color:#1f2937;padding:30px;border-radius:18px;width:95%;max-width:380px;box-shadow:0 15px 40px rgba(0,0,0,.3)}
.loginBox h2{text-align:center;margin-bottom:15px}
.loginBox input{width:100%;padding:13px;border:1px solid #ccc;border-radius:10px;background:#f1f5f9;color:#111;font-size:14px;margin-top:10px;outline:none}
.btn{width:100%;padding:13px;border:none;border-radius:10px;color:white;font-weight:bold;cursor:pointer;margin-top:15px;background:#2563EB}
.btn:hover{opacity:.9}
</style>
</head>
<body>
<div class="loginBox">
<div style="width:70px;height:70px;background:#2563eb;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;color:white;font-size:32px;font-weight:bold;">D</div>
<h2>LIVRILY Login</h2>
<input type="email" id="email" placeholder="Email" autocomplete="off" value="">
<input type="password" id="password" placeholder="Password" autocomplete="new-password" value="">
<button class="btn" onclick="login()">LOGIN</button>
<p id="error" style="color:#DC2626;text-align:center;margin-top:10px;font-size:13px;"></p>
<p style="text-align:center;margin-top:12px;color:#94A3B8;font-size:11px;">Manager & Driver same login<br>All fees editable in Manager Settings</p>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCYF6XBpCqB2ohHTJSLyc1oBe1rGkByzjE",
  authDomain: "livrily-a6e7e.firebaseapp.com",
  projectId: "livrily-a6e7e",
  storageBucket: "livrily-a6e7e.firebasestorage.app",
  messagingSenderId: "904979289112",
  appId: "1:904979289112:web:9981377a9500b940091f6d"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const MANAGER_UID = "69rlujJgE6X8osQj5MjlhA3BrV43";
const MANAGER_EMAIL = "houbadismatmohamed@gmail.com";
function isManager(user){ return user && (user.uid===MANAGER_UID || user.email===MANAGER_EMAIL); }

onAuthStateChanged(auth, async (user)=>{
  if(!user) return;
  if(!isManager(user)){
    let snap = await getDoc(doc(db,"drivers",user.uid));
    if(snap.exists() && snap.data().active===false){
      document.getElementById('error').innerText='Account deactivated. Contact manager.';
      await auth.signOut();
      return;
    }
  }
  if(isManager(user)) location.href='Manager.html';
  else location.href='Driver.html';
});

window.login=async()=>{
  let email=document.getElementById('email').value.trim();
  let pass=document.getElementById('password').value;
  let err=document.getElementById('error');
  err.innerText='';
  if(!email||!pass){ err.innerText='Enter email & password'; return; }
  try{
    await signInWithEmailAndPassword(auth,email,pass);
  }catch(e){ err.innerText=e.message; }
}
</script>
</body>
</html>
