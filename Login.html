<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LIVRILY · Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
    body{background:#0B1120;color:#F8FAFC;min-height:100vh;display:flex;justify-content:center;align-items:center;background:radial-gradient(ellipse at top,#1E293B,#0B1120)}
    .login-box{background:rgba(30,41,59,0.7);backdrop-filter:blur(20px);border:1px solid rgba(56,189,248,0.15);border-radius:24px;padding:48px 40px;max-width:420px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.5)}
    .login-box h1{font-size:28px;font-weight:800;background:linear-gradient(135deg,#38BDF8,#2563EB);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;margin-bottom:8px}
    .login-box .sub{color:#94A3B8;text-align:center;font-size:14px;margin-bottom:24px}
    .login-box input{width:100%;padding:14px 16px;background:rgba(15,23,42,0.8);border:1px solid rgba(56,189,248,0.15);border-radius:12px;color:#F8FAFC;font-size:14px;outline:none;transition:.3s;margin-bottom:12px}
    .login-box input:focus{border-color:#38BDF8;box-shadow:0 0 30px rgba(56,189,248,0.1)}
    .btn-login{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,#2563EB,#38BDF8);color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:.3s}
    .btn-login:hover{transform:scale(1.02);box-shadow:0 0 40px rgba(56,189,248,0.3)}
    .error{color:#F87171;font-size:13px;text-align:center;margin-top:10px;min-height:20px}
    .footer{color:#64748B;font-size:12px;text-align:center;margin-top:20px}
    .role-badge{display:flex;justify-content:center;gap:20px;margin-bottom:20px;color:#94A3B8;font-size:13px}
    .role-badge i{color:#38BDF8;margin-right:6px}
    .lang-bar{display:flex;justify-content:center;gap:6px;margin-bottom:16px}
    .lang-btn{background:transparent;border:1px solid rgba(56,189,248,0.2);color:#94A3B8;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:11px;transition:.3s}
    .lang-btn:hover,.lang-btn.active{background:rgba(56,189,248,0.15);color:#F8FAFC;border-color:#38BDF8}
    [dir="rtl"] .login-box{direction:rtl}
  </style>
</head>
<body>
  <div class="login-box">
    <div class="lang-bar">
      <button class="lang-btn active" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="fr">FR</button>
      <button class="lang-btn" data-lang="ar">ع</button>
      <button class="lang-btn" data-lang="dz">درجة</button>
    </div>
    <h1><i class="fas fa-bolt"></i> LIVRILY</h1>
    <p class="sub" data-i18n="loginSub">Manager · Driver Login</p>
    <div class="role-badge"><span><i class="fas fa-user-tie"></i> <span data-i18n="managerLabel">Manager</span></span><span><i class="fas fa-truck"></i> <span data-i18n="driverLabel">Driver</span></span></div>
    <input id="loginEmail" placeholder="Email" autocomplete="email" />
    <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password" />
    <button class="btn-login" id="loginBtn"><i class="fas fa-sign-in-alt"></i> <span data-i18n="loginBtn">Login</span></button>
    <p class="error" id="loginError"></p>
    <p class="footer" data-i18n="loginFooter">Accounts are created only by Admin<br/>Contact admin if you don't have credentials</p>
  </div>
  <script type="module">
    import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
    const config = {
      apiKey: "AIzaSyCYF6XBpCqB2ohHTJSLyc1oBe1rGkByzjE",
      authDomain: "livrily-a6e7e.firebaseapp.com",
      projectId: "livrily-a6e7e",
      storageBucket: "livrily-a6e7e.firebasestorage.app",
      messagingSenderId: "904979289112",
      appId: "1:904979289112:web:9981377a9500b940091f6d"
    };
    let app; try { app = getApps().length ? getApp() : initializeApp(config); } catch (_) { app = initializeApp(config); }
    const auth = getAuth(app);
    const db = getFirestore(app);
    onAuthStateChanged(auth, async (user)=>{
      if(user){
        const snap=await getDoc(doc(db,"users",user.uid));
        if(snap.exists()){
          const role=snap.data().role;
          if(role==='manager') location.href='Manager.html';
          else if(role==='driver') location.href='Driver.html';
          else if(role==='admin' || snap.data().email==='houbadismatmohamed@gmail.com') location.href='Admin.html';
          else { document.getElementById('loginError').textContent='Invalid role: '+role; await signOut(auth); }
        } else { document.getElementById('loginError').textContent='User profile not found'; await signOut(auth); }
      }
    });
    document.getElementById('loginBtn').addEventListener('click', async ()=>{
      const email=document.getElementById('loginEmail').value.trim();
      const pass=document.getElementById('loginPassword').value;
      const error=document.getElementById('loginError'); error.textContent='';
      if(!email||!pass){ error.textContent='Enter email and password'; return; }
      try{
        const cred=await signInWithEmailAndPassword(auth,email,pass);
        const snap=await getDoc(doc(db,"users",cred.user.uid));
        if(!snap.exists()){ error.textContent='User profile not found'; await signOut(auth); return; }
        const role=snap.data().role;
        if(role==='manager') location.href='Manager.html';
        else if(role==='driver') location.href='Driver.html';
        else if(role==='admin') location.href='Admin.html';
        else { error.textContent='Invalid role: '+role; await signOut(auth); }
      }catch(e){ error.textContent=e.message.replace(/Firebase: /,''); }
    });
    document.getElementById('loginPassword').addEventListener('keydown', (e)=>{ if(e.key==='Enter') document.getElementById('loginBtn').click(); });

    // I18N
    const i18n = {
      en: { loginSub: "Manager · Driver Login", managerLabel: "Manager", driverLabel: "Driver", loginBtn: "Login", loginFooter: "Accounts are created only by Admin\nContact admin if you don't have credentials" },
      fr: { loginSub: "Connexion Gestionnaire · Chauffeur", managerLabel: "Gestionnaire", driverLabel: "Chauffeur", loginBtn: "Se connecter", loginFooter: "Les comptes sont créés uniquement par l'Admin\nContactez l'admin si vous n'avez pas d'identifiants" },
      ar: { loginSub: "تسجيل الدخول - مدير · سائق", managerLabel: "مدير", driverLabel: "سائق", loginBtn: "تسجيل الدخول", loginFooter: "يتم إنشاء الحسابات فقط بواسطة المدير\nاتصل بالمدير إذا لم يكن لديك بيانات اعتماد" },
      dz: { loginSub: "دخول - مدير · سواق", managerLabel: "مدير", driverLabel: "سواق", loginBtn: "دخول", loginFooter: "الحسابات يتصنعو غير من عند المدير\nاتصل بالمدير إذا ماعندكش معلومات" }
    };
    let currentLang = localStorage.getItem('livrily-lang') || 'en';
    function applyLang(lang){
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n;
        if(i18n[lang] && i18n[lang][key]) el.textContent = i18n[lang][key];
      });
      document.documentElement.dir = (lang === 'ar' || lang === 'dz') ? 'rtl' : 'ltr';
      localStorage.setItem('livrily-lang', lang);
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
    }
    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', () => applyLang(btn.dataset.lang));
    });
    applyLang(currentLang);
  </script>
</body>
</html>
